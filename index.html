<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Updated Girl</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --panel: #151722;
        --text: #f4f4f5;
        --muted: #b9bcc7;
        --accent: #d4a574;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a1d2a 0%, var(--bg) 50%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        background: rgba(21, 23, 34, 0.8);
        border: 1px solid rgba(212,165,116,0.25);
        border-radius: 18px;
        padding: 3rem 2.5rem;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        max-width: 640px;
        width: calc(100% - 32px);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.2rem, 7vw, 5rem);
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.5rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .dot {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Updated Girl</h1>
      <p>Coming Soon <span class="dot">.</span></p>
    </main>
  </body>
</html>
