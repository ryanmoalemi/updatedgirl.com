<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Updated Girl</title>
    <style>
      :root {
        --bg: #0d0d11;
        --panel: #141824;
        --text: #f4f4f5;
        --muted: #bcc2cf;
        --accent: #d5b27a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1d2230 0%, var(--bg) 55%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        background: rgba(20, 24, 36, 0.82);
        border: 1px solid rgba(213,178,122,0.35);
        border-radius: 20px;
        padding: 3rem 2rem;
        text-align: center;
        box-shadow: 0 28px 70px rgba(0,0,0,0.45);
        max-width: 640px;
        width: calc(100% - 28px);
      }
      h1 {
        margin: 0 0 0.7rem;
        font-size: clamp(2.25rem, 7vw, 5.2rem);
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(0.95rem, 2vw, 1.45rem);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .dot { color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Updated Girl</h1>
      <p>Coming Soon <span class="dot">.</span></p>
    </main>
  </body>
</html>
